<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JR SCRIPTS - Owner Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #07080a; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: rgba(18, 18, 28, 0.95); border: 1px solid rgba(255, 180, 0, 0.4); border-radius: 16px; width: 100%; max-width: 420px; padding: 25px; box-shadow: 0 0 30px rgba(255, 180, 0, 0.2); text-align: center; }
        h2 { color: #ffc107; font-size: 20px; margin-bottom: 5px; }
        p { color: #8a8a9e; font-size: 12px; margin-bottom: 20px; }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { font-size: 11px; color: #aaa; display: block; margin-bottom: 5px; }
        select, input { width: 100%; background: #141420; border: 1px solid #2e2e45; color: #fff; padding: 10px; border-radius: 8px; font-size: 13px; }
        .btn { background: linear-gradient(135deg, #ff9500, #ff3b30); color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        .btn:hover { opacity: 0.9; }
        .result-box { margin-top: 15px; background: #101018; border: 1px dashed #ffc107; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 14px; color: #ffc107; word-break: break-all; font-weight: bold; }
        .error-msg { color: #ff3b30; font-size: 11px; margin-top: 8px; display: none; }
        #panelContent { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <!-- LOGIN -->
        <div id="loginSection">
            <h2>🔐 OWNER LOGIN</h2>
            <p>Masukkan akses rahasia</p>
            <div class="form-group">
                <label>Username:</label>
                <input type="text" id="userInput" placeholder="Username...">
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="passInput" placeholder="Password...">
            </div>
            <button class="btn" onclick="checkLogin()">🔑 LOGIN</button>
            <div class="error-msg" id="errorMsg">❌ Username atau Password salah!</div>
        </div>

        <!-- PANEL -->
        <div id="panelContent">
            <h2>👑 JR SCRIPTS - OWNER PANEL</h2>
            <p>Generate Key Resmi Berbasis Algoritma</p>

            <div class="form-group">
                <label>Pilih Jenis / Durasi:</label>
                <select id="durationSelect">
                    <option value="24">24 Jam (Giveaway)</option>
                    <option value="48">48 Jam (Giveaway)</option>
                    <option value="240">10 Hari (Giveaway)</option>
                    <option value="99999">👑 LIFETIME PREMIUM</option>
                </select>
            </div>

            <button class="btn" onclick="generateKey()">⚡ GENERATE KEY</button>

            <div id="resultSection" style="display:none;">
                <div class="result-box" id="keyOutput">JRK-XXXX</div>
                <button class="btn" style="background: #00ffc8; color: #000; margin-top: 8px;" onclick="copyKey()">📋 SALIN KEY</button>
            </div>

            <button class="btn" style="background: #252538; margin-top: 15px;" onclick="logout()">🔒 LOGOUT</button>
        </div>
    </div>

    <script>
        window.onload = function() {
            if (localStorage.getItem("JR_OWNER_LOGGED_IN") === "true") showPanel();
        };
        function checkLogin() {
            if (document.getElementById("userInput").value === "unikloo5" && document.getElementById("passInput").value === "1Sampe10") {
                localStorage.setItem("JR_OWNER_LOGGED_IN", "true");
                showPanel();
            } else { document.getElementById("errorMsg").style.display = "block"; }
        }
        function showPanel() {
            document.getElementById("loginSection").style.display = "none";
            document.getElementById("panelContent").style.display = "block";
        }
        function logout() { localStorage.removeItem("JR_OWNER_LOGGED_IN"); location.reload(); }
        
        function generateKey() {
            let type = document.getElementById("durationSelect").value;
            let prefix = (type === "99999") ? "JRXP-" : "JRK-";
            
            // Algoritma Generator: Angka acak yang terikat dengan rumus matematika sederhana
            let num1 = Math.floor(Math.random() * 90) + 10; // 2 digit angka
            let num2 = (num1 * 3) + 7; // Rumus matematika rahasia owner
            let chars = "ABCDEFGHJKLMNPQRSTUVWXYZ";
            let c1 = chars.charAt(Math.floor(Math.random() * chars.length));
            let c2 = chars.charAt(Math.floor(Math.random() * chars.length));

            let newKey = prefix + num1 + c1 + num2 + c2;

            document.getElementById("resultSection").style.display = "block";
            document.getElementById("keyOutput").innerText = newKey;
        }

        function copyKey() {
            navigator.clipboard.writeText(document.getElementById("keyOutput").innerText);
            alert("Key berhasil disalin!");
        }
    </script>
</body>
</html>
